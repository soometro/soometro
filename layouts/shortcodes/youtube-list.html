{{ $id := .Get "id" }}
{{ $title := .Get "title" }}
<div class="youtube-container" style="max-width: 100%; margin: 0 auto 40px auto; width: 100%;">
    <!-- 속도 최적화: loading="lazy" 적용 -->
    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; background: #000;">
        <iframe 
            src="https://www.youtube.com/embed/{{ $id }}" 
            title="{{ $title }}"
            loading="lazy"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>
    <!-- SEO 및 AEO 최적화: 제목에 제목 태그 부여 및 명확한 구조화 -->
    <h3 style="margin-top: 5px; margin-bottom: 0; font-size: 0.95em; font-weight: normal; font-style: italic; color: #666; line-height: 1.4; text-align: center;">
     {{ $title }}
</h3>
</div>
