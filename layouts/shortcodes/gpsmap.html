<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
>
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
></script>
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>

<div class="tool-box gpsmap-tool">

    <div class="gpsmap-input-wrap">
        <label for="gpsmap-files">사진 선택 (여러 장 가능)</label>

        <input
            type="file"
            id="gpsmap-files"
            accept="image/jpeg,image/jpg,image/heic,image/heif"
            multiple
        >
    </div>


    <div class="gpsmap-privacy-note">
        선택한 사진은 서버로 전송되지 않으며, 모든 처리는 이 브라우저 안에서만 이루어집니다.
    </div>


    <div class="gpsmap-actions">

        <button
            type="button"
            id="gpsmap-run"
            class="gpsmap-btn"
        >
            지도에 표시하기
        </button>

        <button
            type="button"
            id="gpsmap-clear"
            class="gpsmap-btn"
        >
            초기화
        </button>

    </div>


    <div
        class="gpsmap-summary"
        id="gpsmap-summary"
        aria-live="polite"
    >

        <div class="gpsmap-summary-row">
            <span>총 사진</span>
            <strong id="gpsmap-total">0장</strong>
        </div>

        <div class="gpsmap-summary-row">
            <span>GPS 있음</span>
            <strong id="gpsmap-with-gps">0장</strong>
        </div>

        <div class="gpsmap-summary-row">
            <span>GPS 없음</span>
            <strong id="gpsmap-without-gps">0장</strong>
        </div>

    </div>


    <div
        class="gpsmap-map"
        id="gpsmap-map"
    ></div>


    <div
        class="gpsmap-message"
        id="gpsmap-message"
        aria-live="polite"
    ></div>

</div>


<style>
.gpsmap-tool {
    width: 100%;
    margin: 2rem 0;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
}


/* 파일 입력 */
.gpsmap-input-wrap {
    width: 100%;
    margin-bottom: 0.8rem;
}

.gpsmap-input-wrap label {
    display: block;
    margin-bottom: 0.6rem;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--body-font-color);
}

.gpsmap-input-wrap input {
    display: block;
    width: 100%;
    min-height: 44px;
    box-sizing: border-box;
    padding: 0.6rem 0.8rem;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    background: #ffffff;
    color: #222222;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    font-size: 0.9rem;
    outline: none;
}


/* 안내문구 */
.gpsmap-privacy-note {
    margin-bottom: 1rem;
    font-size: 0.82rem;
    line-height: 1.6;
    color: #888888;
}


/* 버튼 */
.gpsmap-actions {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 1rem;
}

.gpsmap-btn {
    flex: 1;
    min-width: 110px;
    min-height: 44px;
    padding: 0.65rem 1rem;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    background: #f8f8f8;
    color: #222222;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition:
        background 0.15s ease,
        border-color 0.15s ease;
}

.gpsmap-btn:hover {
    background: #eeeeee;
    border-color: #c8c8c8;
}

.gpsmap-btn:active {
    transform: translateY(1px);
}


/* 요약 */
.gpsmap-summary {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.5rem;
    margin-bottom: 1rem;
}

.gpsmap-summary-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-sizing: border-box;
    min-height: 48px;
    padding: 0.7rem 0.8rem;
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    background: #fafafa;
}

.gpsmap-summary-row span {
    font-size: 0.8rem;
    color: #777777;
}

.gpsmap-summary-row strong {
    font-size: 1rem;
    font-weight: 600;
    color: var(--body-font-color);
}


/* 지도 */
.gpsmap-map {
    width: 100%;
    height: 400px;
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    overflow: hidden;
    background: #f4f4f4;
}


/* 메시지 */
.gpsmap-message {
    min-height: 1.2rem;
    margin-top: 0.8rem;
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--body-font-color);
}


/* 데스크톱 */
@media (min-width: 700px) {

    .gpsmap-actions {
        justify-content: flex-end;
    }

    .gpsmap-actions .gpsmap-btn {
        flex: 0 0 auto;
        min-width: 130px;
    }

    .gpsmap-summary {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
    }
}


/* 다크 모드 */
html.forced-dark .gpsmap-input-wrap input,
html[data-theme="dark"] .gpsmap-input-wrap input,
body.forced-dark .gpsmap-input-wrap input {
    background: #1a1a1a;
    color: #eeeeee;
    border-color: #444444;
}

html.forced-dark .gpsmap-summary-row,
html[data-theme="dark"] .gpsmap-summary-row,
body.forced-dark .gpsmap-summary-row {
    background: #1a1a1a;
    border-color: #444444;
}

html.forced-dark .gpsmap-summary-row span,
html[data-theme="dark"] .gpsmap-summary-row span,
body.forced-dark .gpsmap-summary-row span {
    color: #aaaaaa;
}

html.forced-dark .gpsmap-btn,
html[data-theme="dark"] .gpsmap-btn,
body.forced-dark .gpsmap-btn {
    background: #2a2a2a;
    color: #eeeeee;
    border-color: #444444;
}

html.forced-dark .gpsmap-btn:hover,
html[data-theme="dark"] .gpsmap-btn:hover,
body.forced-dark .gpsmap-btn:hover {
    background: #333333;
    border-color: #555555;
}

html.forced-dark .gpsmap-map,
html[data-theme="dark"] .gpsmap-map,
body.forced-dark .gpsmap-map {
    background: #1a1a1a;
    border-color: #444444;
}


/* 모바일 */
@media (max-width: 600px) {

    .gpsmap-tool {
        margin: 1.5rem 0;
    }

    .gpsmap-summary {
        grid-template-columns: 1fr;
    }

    .gpsmap-summary-row {
        min-height: 46px;
    }

    .gpsmap-map {
        height: 280px;
    }

    .gpsmap-btn {
        min-width: 0;
    }
}
</style>


<script>
(function () {

    const filesInput = document.getElementById(
        "gpsmap-files"
    );

    const runButton = document.getElementById(
        "gpsmap-run"
    );

    const clearButton = document.getElementById(
        "gpsmap-clear"
    );

    const totalEl = document.getElementById(
        "gpsmap-total"
    );

    const withGpsEl = document.getElementById(
        "gpsmap-with-gps"
    );

    const withoutGpsEl = document.getElementById(
        "gpsmap-without-gps"
    );

    const mapContainer = document.getElementById(
        "gpsmap-map"
    );

    const message = document.getElementById(
        "gpsmap-message"
    );


    if (
        !filesInput ||
        !runButton ||
        !clearButton ||
        !totalEl ||
        !withGpsEl ||
        !withoutGpsEl ||
        !mapContainer ||
        !message
    ) {
        return;
    }


    let mapInstance = null;


    function resetSummary() {

        totalEl.textContent = "0장";
        withGpsEl.textContent = "0장";
        withoutGpsEl.textContent = "0장";

    }


    function resetMap() {

        if (mapInstance) {

            mapInstance.remove();

            mapInstance = null;

        }

    }


    async function readOne(file) {

        try {

            const output = await window.exifr.parse(
                file
            );

            if (
                !output ||
                typeof output.latitude !== "number" ||
                typeof output.longitude !== "number"
            ) {

                return {
                    name: file.name,
                    hasGps: false
                };

            }

            return {
                name: file.name,
                hasGps: true,
                lat: output.latitude,
                lon: output.longitude,
                date:
                    output.DateTimeOriginal instanceof Date
                        ? output.DateTimeOriginal
                        : null
            };

        } catch (error) {

            return {
                name: file.name,
                hasGps: false
            };

        }

    }


    async function run() {

        const files = Array.from(
            filesInput.files || []
        );


        if (files.length === 0) {

            message.textContent =
                "사진을 선택해주세요.";

            return;

        }


        message.textContent =
            "사진에서 GPS 정보를 읽는 중입니다...";

        runButton.disabled = true;


        const results = await Promise.all(
            files.map(readOne)
        );


        runButton.disabled = false;


        const withGps = results.filter(
            function (item) {
                return item.hasGps;
            }
        );

        const withoutGps = results.filter(
            function (item) {
                return !item.hasGps;
            }
        );


        totalEl.textContent =
            results.length + "장";

        withGpsEl.textContent =
            withGps.length + "장";

        withoutGpsEl.textContent =
            withoutGps.length + "장";


        if (withGps.length === 0) {

            message.textContent =
                "선택한 사진에서 GPS 정보를 찾을 수 없습니다.";

            resetMap();

            return;

        }


        withGps.forEach(function (item, index) {
            item._index = index;
        });

        const dated = withGps.filter(function (item) {
            return item.date !== null;
        });

        const undated = withGps.filter(function (item) {
            return item.date === null;
        });

        dated.sort(function (a, b) {
            return a.date.getTime() - b.date.getTime();
        });

        const ordered = dated.concat(undated);


        resetMap();


        mapInstance = window.L.map(
            mapContainer
        );


        window.L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }
        ).addTo(mapInstance);


        const latLngs = [];


        ordered.forEach(function (item) {

            const latLng = [
                item.lat,
                item.lon
            ];

            latLngs.push(latLng);


            const popupText =
                item.name +
                (item.date
                    ? "<br>" + item.date.toLocaleString("ko-KR")
                    : "");


            window.L.marker(latLng)
                .addTo(mapInstance)
                .bindPopup(popupText);

        });


        if (latLngs.length > 1) {

            window.L.polyline(
                latLngs,
                {
                    color: "#3388ff",
                    weight: 3,
                    opacity: 0.7
                }
            ).addTo(mapInstance);

        }


        mapInstance.fitBounds(
            latLngs,
            {
                padding: [30, 30]
            }
        );


        message.textContent =
            withoutGps.length > 0
                ? withoutGps.length + "장은 GPS 정보가 없어 지도에 표시되지 않았습니다."
                : "모든 사진을 지도에 표시했습니다.";

    }


    runButton.addEventListener(
        "click",
        run
    );


    clearButton.addEventListener(
        "click",
        function () {

            filesInput.value = "";

            resetSummary();

            resetMap();

            message.textContent = "";

        }
    );

})();
</script>
