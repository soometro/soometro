<div class="tool-box datecalc-tool">

    <div class="datecalc-input-wrap">
        <label for="datecalc-start">시작일</label>

        <input
            type="date"
            id="datecalc-start"
        >
    </div>


    <div class="datecalc-input-wrap">
        <label for="datecalc-end">종료일</label>

        <input
            type="date"
            id="datecalc-end"
        >
    </div>


    <div class="datecalc-option">
        <label>
            <input
                type="checkbox"
                id="datecalc-include-start"
                checked
            >
            <span>시작일 포함</span>
        </label>
    </div>


    <div class="datecalc-actions">

        <button
            type="button"
            id="datecalc-calculate"
            class="datecalc-btn"
        >
            계산하기
        </button>

        <button
            type="button"
            id="datecalc-clear"
            class="datecalc-btn"
        >
            지우기
        </button>

    </div>


    <div
        class="datecalc-result"
        id="datecalc-result"
        aria-live="polite"
    >

        <div class="datecalc-result-row">
            <span>총 일수</span>
            <strong id="datecalc-total-days">0일</strong>
        </div>

        <div class="datecalc-result-row">
            <span>주 단위</span>
            <strong id="datecalc-weeks">0주 0일</strong>
        </div>

        <div class="datecalc-result-row">
            <span>기간</span>
            <strong id="datecalc-period">0년 0개월 0일</strong>
        </div>

    </div>


    <div
        class="datecalc-message"
        id="datecalc-message"
        aria-live="polite"
    ></div>

</div>


<style>
.datecalc-tool {
    width: 100%;
    margin: 2rem 0;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
}


/* 날짜 입력 */
.datecalc-input-wrap {
    width: 100%;
    margin-bottom: 1rem;
}

.datecalc-input-wrap label {
    display: block;
    margin-bottom: 0.6rem;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--body-font-color);
}

.datecalc-input-wrap input {
    display: block;
    width: 100%;
    min-height: 44px;
    box-sizing: border-box;
    padding: 0.65rem 0.8rem;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    background: #ffffff;
    color: #222222;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    font-size: 0.95rem;
    outline: none;
}

.datecalc-input-wrap input:focus {
    border-color: var(--color-link, #888);
}


/* 옵션 */
.datecalc-option {
    margin: 0.2rem 0 1rem;
}

.datecalc-option label {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
    color: var(--body-font-color);
    cursor: pointer;
}

.datecalc-option input {
    width: 16px;
    height: 16px;
    margin: 0;
    cursor: pointer;
}


/* 버튼 */
.datecalc-actions {
    display: flex;
    gap: 0.6rem;
}

.datecalc-btn {
    flex: 1;
    min-width: 110px;
    min-height: 44px;
    padding: 0.65rem 1rem;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    background: #f8f8f8;
    color: #222222;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition:
        background 0.15s ease,
        border-color 0.15s ease;
}

.datecalc-btn:hover {
    background: #eeeeee;
    border-color: #c8c8c8;
}

.datecalc-btn:active {
    transform: translateY(1px);
}


/* 결과 */
.datecalc-result {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.5rem;
    margin-top: 1rem;
}

.datecalc-result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-sizing: border-box;
    min-height: 48px;
    padding: 0.7rem 0.8rem;
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    background: #fafafa;
}

.datecalc-result-row span {
    font-size: 0.8rem;
    color: #777777;
}

.datecalc-result-row strong {
    font-size: 1rem;
    font-weight: 600;
    color: var(--body-font-color);
}


/* 메시지 */
.datecalc-message {
    min-height: 1.2rem;
    margin-top: 0.8rem;
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--body-font-color);
}


/* 데스크톱 */
@media (min-width: 700px) {

    .datecalc-actions {
        justify-content: flex-end;
    }

    .datecalc-actions .datecalc-btn {
        flex: 0 0 auto;
        min-width: 100px;
    }

    .datecalc-result {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
    }
}


/* 다크 모드 */
html.forced-dark .datecalc-input-wrap input,
html[data-theme="dark"] .datecalc-input-wrap input,
body.forced-dark .datecalc-input-wrap input {
    background: #1a1a1a;
    color: #eeeeee;
    border-color: #444444;
}

html.forced-dark .datecalc-result-row,
html[data-theme="dark"] .datecalc-result-row,
body.forced-dark .datecalc-result-row {
    background: #1a1a1a;
    border-color: #444444;
}

html.forced-dark .datecalc-result-row span,
html[data-theme="dark"] .datecalc-result-row span,
body.forced-dark .datecalc-result-row span {
    color: #aaaaaa;
}

html.forced-dark .datecalc-btn,
html[data-theme="dark"] .datecalc-btn,
body.forced-dark .datecalc-btn {
    background: #2a2a2a;
    color: #eeeeee;
    border-color: #444444;
}

html.forced-dark .datecalc-btn:hover,
html[data-theme="dark"] .datecalc-btn:hover,
body.forced-dark .datecalc-btn:hover {
    background: #333333;
    border-color: #555555;
}


/* 모바일 */
@media (max-width: 600px) {

    .datecalc-tool {
        margin: 1.5rem 0;
    }

    .datecalc-result {
        grid-template-columns: 1fr;
    }

    .datecalc-result-row {
        min-height: 46px;
    }

    .datecalc-btn {
        min-width: 0;
    }
}
</style>


<script>
(function () {

    const startInput = document.getElementById(
        "datecalc-start"
    );

    const endInput = document.getElementById(
        "datecalc-end"
    );

    const includeStartInput = document.getElementById(
        "datecalc-include-start"
    );

    const calculateButton = document.getElementById(
        "datecalc-calculate"
    );

    const clearButton = document.getElementById(
        "datecalc-clear"
    );

    const totalDays = document.getElementById(
        "datecalc-total-days"
    );

    const weeks = document.getElementById(
        "datecalc-weeks"
    );

    const period = document.getElementById(
        "datecalc-period"
    );

    const message = document.getElementById(
        "datecalc-message"
    );


    if (
        !startInput ||
        !endInput ||
        !includeStartInput ||
        !calculateButton ||
        !clearButton ||
        !totalDays ||
        !weeks ||
        !period ||
        !message
    ) {
        return;
    }


    function parseDate(value) {

        if (!value) {
            return null;
        }

        const parts =
            value.split("-");

        if (parts.length !== 3) {
            return null;
        }

        const year =
            Number(parts[0]);

        const month =
            Number(parts[1]);

        const day =
            Number(parts[2]);


        const date =
            new Date(
                year,
                month - 1,
                day
            );


        if (
            date.getFullYear() !== year ||
            date.getMonth() !== month - 1 ||
            date.getDate() !== day
        ) {
            return null;
        }


        date.setHours(
            0,
            0,
            0,
            0
        );


        return date;

    }


    function dateDiffInDays(
        startDate,
        endDate
    ) {

        const milliseconds =
            endDate.getTime() -
            startDate.getTime();

        return Math.round(
            milliseconds / 86400000
        );

    }


    function calculateCalendarPeriod(
        startDate,
        endDate
    ) {

        let years =
            endDate.getFullYear() -
            startDate.getFullYear();

        let months =
            endDate.getMonth() -
            startDate.getMonth();

        let days =
            endDate.getDate() -
            startDate.getDate();


        if (days < 0) {

            months--;

            const previousMonth =
                new Date(
                    endDate.getFullYear(),
                    endDate.getMonth(),
                    0
                );

            days +=
                previousMonth.getDate();

        }


        if (months < 0) {

            years--;

            months += 12;

        }


        return {
            years: years,
            months: months,
            days: days
        };

    }


    function calculate() {

        const startDate =
            parseDate(
                startInput.value
            );

        const endDate =
            parseDate(
                endInput.value
            );


        if (
            !startDate ||
            !endDate
        ) {

            totalDays.textContent =
                "0일";

            weeks.textContent =
                "0주 0일";

            period.textContent =
                "0년 0개월 0일";

            message.textContent =
                "시작일과 종료일을 모두 입력해주세요.";

            return;

        }


        if (endDate < startDate) {

            totalDays.textContent =
                "0일";

            weeks.textContent =
                "0주 0일";

            period.textContent =
                "0년 0개월 0일";

            message.textContent =
                "종료일은 시작일보다 빠를 수 없습니다.";

            return;

        }


        let days =
            dateDiffInDays(
                startDate,
                endDate
            );


        if (
            includeStartInput.checked
        ) {
            days += 1;
        }


        const weekCount =
            Math.floor(
                days / 7
            );

        const remainingDays =
            days % 7;


        const calendarPeriod =
            calculateCalendarPeriod(
                startDate,
                endDate
            );


        totalDays.textContent =
            days + "일";

        weeks.textContent =
            weekCount +
            "주 " +
            remainingDays +
            "일";

        period.textContent =
            calendarPeriod.years +
            "년 " +
            calendarPeriod.months +
            "개월 " +
            calendarPeriod.days +
            "일";


        message.textContent =
            includeStartInput.checked
                ? "시작일을 포함하여 계산했습니다."
                : "시작일을 제외하고 계산했습니다.";

    }


    calculateButton.addEventListener(
        "click",
        calculate
    );


    clearButton.addEventListener(
        "click",
        function () {

            startInput.value = "";
            endInput.value = "";

            includeStartInput.checked =
                true;

            totalDays.textContent =
                "0일";

            weeks.textContent =
                "0주 0일";

            period.textContent =
                "0년 0개월 0일";

            message.textContent =
                "";

            startInput.focus();

        }
    );


    startInput.addEventListener(
        "change",
        function () {

            if (
                startInput.value &&
                endInput.value
            ) {
                calculate();
            }

        }
    );


    endInput.addEventListener(
        "change",
        function () {

            if (
                startInput.value &&
                endInput.value
            ) {
                calculate();
            }

        }
    );


    includeStartInput.addEventListener(
        "change",
        function () {

            if (
                startInput.value &&
                endInput.value
            ) {
                calculate();
            }

        }
    );

})();
</script>
