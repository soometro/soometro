<script>
(function () {
    const input = document.getElementById("textdeduplicate-input");
    const result = document.getElementById("textdeduplicate-result");

    const inputCount = document.getElementById(
        "textdeduplicate-input-count"
    );

    const resultCount = document.getElementById(
        "textdeduplicate-result-count"
    );

    const removedCount = document.getElementById(
        "textdeduplicate-removed-count"
    );

    const copyButton = document.getElementById(
        "textdeduplicate-copy"
    );

    const clearButton = document.getElementById(
        "textdeduplicate-clear"
    );


    if (
        !input ||
        !result ||
        !inputCount ||
        !resultCount ||
        !removedCount ||
        !copyButton ||
        !clearButton
    ) {
        return;
    }


    /*
     * 실제 중복 제거
     *
     * - 줄 단위로 처리
     * - 빈 줄은 입력 줄 수에서는 제외
     * - 앞뒤 공백은 제거
     * - 동일한 줄은 처음 등장한 것만 유지
     * - 원래 입력 순서는 유지
     */
    function deduplicateText() {

        const rawText = input.value;

        if (!rawText.trim()) {
            inputCount.textContent = "0";
            resultCount.textContent = "0";
            removedCount.textContent = "0";
            result.value = "";
            return;
        }


        const lines = rawText
            .split(/\r?\n/)
            .map(function (line) {
                return line.trim();
            })
            .filter(function (line) {
                return line !== "";
            });


        const uniqueLines = [];
        const seen = new Set();


        lines.forEach(function (line) {

            if (!seen.has(line)) {
                seen.add(line);
                uniqueLines.push(line);
            }

        });


        inputCount.textContent = lines.length;
        resultCount.textContent = uniqueLines.length;
        removedCount.textContent =
            lines.length - uniqueLines.length;

        result.value = uniqueLines.join("\n");
    }


    /*
     * 입력 즉시 자동 처리
     */
    input.addEventListener("input", deduplicateText);


    /*
     * 결과 복사
     */
    copyButton.addEventListener("click", function () {

        const text = result.value;

        if (!text) {
            alert("복사할 결과가 없습니다.");
            return;
        }


        if (
            navigator.clipboard &&
            typeof navigator.clipboard.writeText === "function"
        ) {

            navigator.clipboard.writeText(text)
                .then(function () {
                    alert("결과가 클립보드에 복사되었습니다.");
                })
                .catch(function () {
                    fallbackCopy(text);
                });

        } else {
            fallbackCopy(text);
        }

    });


    /*
     * 클립보드 API를 사용할 수 없는 환경용
     */
    function fallbackCopy(text) {

        const temp = document.createElement("textarea");

        temp.value = text;
        temp.style.position = "fixed";
        temp.style.left = "-9999px";

        document.body.appendChild(temp);

        temp.focus();
        temp.select();

        try {
            document.execCommand("copy");
            alert("결과가 클립보드에 복사되었습니다.");
        } catch (error) {
            alert("복사하지 못했습니다. 결과를 직접 선택해 복사해주세요.");
        }

        document.body.removeChild(temp);
    }


    /*
     * 지우기
     */
    clearButton.addEventListener("click", function () {

        input.value = "";
        result.value = "";

        inputCount.textContent = "0";
        resultCount.textContent = "0";
        removedCount.textContent = "0";

        input.focus();
    });


    /*
     * 초기 상태
     */
    deduplicateText();

})();
</script>
