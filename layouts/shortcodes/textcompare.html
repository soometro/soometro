<div class="tool-box textcompare-tool">

    <div class="textcompare-guide">
        <strong>사용 방법</strong>
        <p>
            수정 전 텍스트와 수정 후 텍스트를 각각 입력한 뒤
            <strong>비교하기</strong>를 누르면 달라진 부분을 확인할 수 있습니다.

            수정 전 내용
        </div>

        <div>
            <strong>+</strong>
            수정 후 내용
        </div>

    </div>

</div>

<script>
(function () {

    const beforeInput = document.getElementById(
        "textcompare-input-before"
    );

    const afterInput = document.getElementById(
        "textcompare-input-after"
    );

    const compareButton = document.getElementById(
        "textcompare-compare"
    );

    const clearButton = document.getElementById(
        "textcompare-clear"
    );

    const sameCount = document.getElementById(
        "textcompare-same-count"
    );

    const addedCount = document.getElementById(
        "textcompare-added-count"
    );

    const deletedCount = document.getElementById(
        "textcompare-deleted-count"
    );

    const message = document.getElementById(
        "textcompare-message"
    );

    const result = document.getElementById(
        "textcompare-result"
    );


    if (
        !beforeInput ||
        !afterInput ||
        !compareButton ||
        !clearButton ||
        !sameCount ||
        !addedCount ||
        !deletedCount ||
        !message ||
        !result
    ) {
        return;
    }


    function splitLines(text) {

        if (!text) {
            return [];
        }

        return text.split(/\r\n|\r|\n/);

    }


    function tokenize(text) {

        if (!text) {
            return [];
        }

        return text.match(
            /[가-힣]+|[A-Za-z]+|[0-9]+|[^\s가-힣A-Za-z0-9]|\s+/g
        ) || [];

    }


    function diffTokens(oldText, newText) {

        const oldTokens = tokenize(oldText);
        const newTokens = tokenize(newText);

        const n = oldTokens.length;
        const m = newTokens.length;

        const dp = Array.from(
            { length: n + 1 },
            function () {
                return new Uint32Array(m + 1);
            }
        );


        for (let i = n - 1; i >= 0; i--) {

            for (let j = m - 1; j >= 0; j--) {

                if (oldTokens[i] === newTokens[j]) {

                    dp[i][j] =
                        dp[i + 1][j + 1] + 1;

                } else {

                    dp[i][j] = Math.max(
                        dp[i + 1][j],
                        dp[i][j + 1]
                    );

                }

            }

        }


        const oldResult = [];
        const newResult = [];

        let i = 0;
        let j = 0;


        while (i < n && j < m) {

            if (oldTokens[i] === newTokens[j]) {

                oldResult.push({
                    text: oldTokens[i],
                    changed: false
                });

                newResult.push({
                    text: newTokens[j],
                    changed: false
                });

                i++;
                j++;

            } else if (
                dp[i + 1][j] >= dp[i][j + 1]
            ) {

                oldResult.push({
                    text: oldTokens[i],
                    changed: true
                });

                i++;

            } else {

                newResult.push({
                    text: newTokens[j],
                    changed: true
                });

                j++;

            }

        }


        while (i < n) {

            oldResult.push({
                text: oldTokens[i],
                changed: true
            });

            i++;

        }


        while (j < m) {

            newResult.push({
                text: newTokens[j],
                changed: true
            });

            j++;

        }


        return {
            oldResult: oldResult,
            newResult: newResult
        };

    }


    function buildDiff(beforeText, afterText) {

        const beforeLines =
            splitLines(beforeText);

        const afterLines =
            splitLines(afterText);

        const n = beforeLines.length;
        const m = afterLines.length;

        const dp = Array.from(
            { length: n + 1 },
            function () {
                return new Uint32Array(m + 1);
            }
        );


        for (let i = n - 1; i >= 0; i--) {

            for (let j = m - 1; j >= 0; j--) {

                if (beforeLines[i] === afterLines[j]) {

                    dp[i][j] =
                        dp[i + 1][j + 1] + 1;

                } else {

                    dp[i][j] = Math.max(
                        dp[i + 1][j],
                        dp[i][j + 1]
                    );

                }

            }

        }


        const diff = [];

        let i = 0;
        let j = 0;


        while (i < n && j < m) {

            if (beforeLines[i] === afterLines[j]) {

                diff.push({
                    type: "same",
                    oldText: beforeLines[i],
                    newText: afterLines[j]
                });

                i++;
                j++;

            } else if (
                dp[i + 1][j] >= dp[i][j + 1]
            ) {

                diff.push({
                    type: "deleted",
                    oldText: beforeLines[i]
                });

                i++;

            } else {

                diff.push({
                    type: "added",
                    newText: afterLines[j]
                });

                j++;

            }

        }


        while (i < n) {

            diff.push({
                type: "deleted",
                oldText: beforeLines[i]
            });

            i++;

        }


        while (j < m) {

            diff.push({
                type: "added",
                newText: afterLines[j]
            });

            j++;

        }


        return diff;

    }


    function normalizeDiff(diff) {

        const normalized = [];

        let i = 0;


        while (i < diff.length) {

            if (
                diff[i].type === "deleted" &&
                i + 1 < diff.length &&
                diff[i + 1].type === "added"
            ) {

                normalized.push({
                    type: "changed",
                    oldText: diff[i].oldText,
                    newText: diff[i + 1].newText
                });

                i += 2;
                continue;

            }


            normalized.push(diff[i]);

            i++;

        }


        return normalized;

    }


    function updateSummary(diff) {

        let same = 0;
        let added = 0;
        let deleted = 0;


        diff.forEach(function (item) {

            if (item.type === "same") {

                same++;

            } else if (item.type === "added") {

                added++;

            } else if (item.type === "deleted") {

                deleted++;

            } else if (item.type === "changed") {

                deleted++;
                added++;

            }

        });


        sameCount.textContent =
            same + "줄";

        addedCount.textContent =
            added + "줄";

        deletedCount.textContent =
            deleted + "줄";


        return {
            same: same,
            added: added,
            deleted: deleted
        };

    }


    function renderTokens(container, tokens) {

        tokens.forEach(function (token) {

            if (
                token.changed &&
                token.text.trim() !== ""
            ) {

                const mark =
                    document.createElement("span");

                mark.className =
                    "textcompare-diff-token";

                mark.textContent =
                    token.text;

                container.appendChild(mark);

            } else {

                container.appendChild(
                    document.createTextNode(
                        token.text
                    )
                );

            }

        });

    }


    function createLine(type, text) {

        const line =
            document.createElement("div");

        line.className =
            "textcompare-result-line " +
            type;


        const marker =
            document.createElement("span");

        marker.className =
            "textcompare-marker";

        marker.textContent =
            type === "added"
                ? "+"
                : "−";


        const textContainer =
            document.createElement("span");

        textContainer.className =
            "textcompare-line-text";

        textContainer.textContent =
            text === ""
                ? "(빈 줄)"
                : text;


        line.appendChild(marker);
        line.appendChild(textContainer);


        return line;

    }


    function createChangedLines(
        oldText,
        newText
    ) {

        const pair =
            diffTokens(
                oldText,
                newText
            );


        const oldLine =
            document.createElement("div");

        oldLine.className =
            "textcompare-result-line deleted";


        const oldMarker =
            document.createElement("span");

        oldMarker.className =
            "textcompare-marker";

        oldMarker.textContent =
            "−";


        const oldTextContainer =
            document.createElement("span");

        oldTextContainer.className =
            "textcompare-line-text";


        renderTokens(
            oldTextContainer,
            pair.oldResult
        );


        oldLine.appendChild(
            oldMarker
        );

        oldLine.appendChild(
            oldTextContainer
        );


        const newLine =
            document.createElement("div");

        newLine.className =
            "textcompare-result-line added";


        const newMarker =
            document.createElement("span");

        newMarker.className =
            "textcompare-marker";

        newMarker.textContent =
            "+";


        const newTextContainer =
            document.createElement("span");

        newTextContainer.className =
            "textcompare-line-text";


        renderTokens(
            newTextContainer,
            pair.newResult
        );


        newLine.appendChild(
            newMarker
        );

        newLine.appendChild(
            newTextContainer
        );


        return {
            oldLine: oldLine,
            newLine: newLine
        };

    }


    function renderResult(diff) {

        result.innerHTML = "";


        const changedLines =
            diff.filter(
                function (item) {
                    return item.type !== "same";
                }
            );


        if (changedLines.length === 0) {

            const empty =
                document.createElement("div");

            empty.className =
                "textcompare-empty";

            empty.textContent =
                "달라진 내용이 없습니다.";


            result.appendChild(
                empty
            );

            return;

        }


        changedLines.forEach(
            function (item) {

                if (
                    item.type === "changed"
                ) {

                    const changed =
                        createChangedLines(
                            item.oldText,
                            item.newText
                        );


                    result.appendChild(
                        changed.oldLine
                    );

                    result.appendChild(
                        changed.newLine
                    );

                    return;

                }


                if (
                    item.type === "deleted"
                ) {

                    result.appendChild(
                        createLine(
                            "deleted",
                            item.oldText
                        )
                    );

                    return;

                }


                if (
                    item.type === "added"
                ) {

                    result.appendChild(
                        createLine(
                            "added",
                            item.newText
                        )
                    );

                }

            }
        );

    }


    function compareTexts() {

        const beforeText =
            beforeInput.value;

        const afterText =
            afterInput.value;


        if (
            !beforeText &&
            !afterText
        ) {

            sameCount.textContent =
                "0줄";

            addedCount.textContent =
                "0줄";

            deletedCount.textContent =
                "0줄";

            message.textContent =
                "";

            result.innerHTML =
                '<div class="textcompare-empty">' +
                "두 텍스트를 입력한 후 비교하기를 눌러주세요." +
                "</div>";

            return;

        }


        const rawDiff =
            buildDiff(
                beforeText,
                afterText
            );


        const diff =
            normalizeDiff(
                rawDiff
            );


        const summary =
            updateSummary(
                diff
            );


        if (
            summary.added === 0 &&
            summary.deleted === 0
        ) {

            message.textContent =
                "두 텍스트가 같습니다.";

        } else {

            message.textContent =
                "변경된 줄: " +
                (
                    summary.added +
                    summary.deleted
                ) +
                "줄";

        }


        renderResult(
            diff
        );

    }


    compareButton.addEventListener(
        "click",
        compareTexts
    );


    clearButton.addEventListener(
        "click",
        function () {

            beforeInput.value = "";
            afterInput.value = "";

            sameCount.textContent =
                "0줄";

            addedCount.textContent =
                "0줄";

            deletedCount.textContent =
                "0줄";

            message.textContent =
                "";

            result.innerHTML =
                '<div class="textcompare-empty">' +
                "두 텍스트를 입력한 후 비교하기를 눌러주세요." +
                "</div>";

            beforeInput.focus();

        }
    );
