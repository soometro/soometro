{{ define "main" }}
<div class="graph-page">
  <header class="graph-header">
    <h1>{{ .Title }}</h1>
    <p>soometro 게시물 사이의 연결 관계를 시각적으로 탐색합니다.</p>
  </header>

  <div id="knowledge-graph" class="knowledge-graph">
    <div class="graph-loading">지식 그래프를 불러오는 중...</div>
  </div>
</div>

<style>
.graph-page {
  width: 100%;
}

.graph-header {
  margin-bottom: 2rem;
}

.graph-header h1 {
  margin-bottom: 0.5rem;
}

.graph-header p {
  opacity: 0.7;
}

.knowledge-graph {
  width: 100%;
  min-height: 650px;
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  background: var(--body-background);
}

.graph-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.6;
}

@media (max-width: 768px) {
  .knowledge-graph {
    min-height: 500px;
  }
}
</style>
{{ end }}
